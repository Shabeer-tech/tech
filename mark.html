<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mark Attendance</title><link rel="stylesheet" href="admin.css"><style>.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}select,input{padding:10px;border:1px solid #ccc;border-radius:5px}.hint{background:#eef4ff;padding:12px;border-radius:8px;margin:10px 0}</style>  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#144678">
</head><body><header><div><h1>Mark Attendance</h1><p>Subject-wise attendance</p></div><button onclick="logout()">Logout</button></header><nav id="adminNav"><button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="adminNavLinks">☰ Menu</button><div class="nav-links" id="adminNavLinks"><a href="admin.html">Dashboard</a><a href="students.html">Students</a><a href="mark.html">Mark Attendance</a><a href="records.html">Records</a><a href="reports.html">Reports</a><a href="settings.html">Settings</a></div></nav><main><div class="box"><label>Date: <input type="date" id="date"></label> <label>Subject: <select id="subject"></select></label> <label style="font-weight:700">Group: <select id="group"><option value="A+B">A+B — All Students</option><option value="A">A — Roll No. 1–60</option><option value="B">B — Roll No. 61+</option></select></label> <button class="btn" id="loadBtn">Load Students</button><div class="hint"> </div></div><div class="box" style="overflow:auto"><table class="table"><thead><tr><th>Roll No.</th><th>Name</th><th>Type</th><th>Status</th></tr></thead><tbody id="body"></tbody></table><button id="save" class="btn" style="display:none">Submit Attendance</button><p id="msg"></p></div></main><script type="module">
import {requireStaff,signOut,auth,db,collection,getDocs,doc,getDoc,setDoc,serverTimestamp,firebaseErrorMessage,query,where,writeBatch,} from './firebase.js';
import {attendanceKey,loadSubjects,safeText} from './attendance-utils.js';
let list=[], existingStatusMap={};const STUDENT_CACHE_KEY='attendance_students_v2';const STUDENT_CACHE_TTL=30*60*1000;const dateEl=document.getElementById('date'),sub=document.getElementById('subject'),groupEl=document.getElementById('group'),body=document.getElementById('body'),saveBtn=document.getElementById('save'),msg=document.getElementById('msg');
dateEl.value=new Date().toISOString().slice(0,10);await requireStaff();
try{const subjects=await loadSubjects(db,collection,doc,getDoc);sub.innerHTML=subjects.map(s=>`<option>${safeText(s)}</option>`).join('');}catch(e){msg.textContent=firebaseErrorMessage(e)}
document.getElementById('loadBtn').onclick=async()=>{try{let cached=null;try{cached=JSON.parse(localStorage.getItem(STUDENT_CACHE_KEY)||'null')}catch(_){};if(cached&&cached.ts&&Date.now()-cached.ts<STUDENT_CACHE_TTL&&Array.isArray(cached.data)){list=cached.data}else{const snap=await getDocs(collection(db,'students'));list=snap.docs.map(d=>({id:d.id,...d.data()}));try{localStorage.setItem(STUDENT_CACHE_KEY,JSON.stringify({ts:Date.now(),data:list}))}catch(_){} }list=list.slice().sort((a,b)=>String(a.rollNo).localeCompare(String(b.rollNo),undefined,{numeric:true}));
const group=groupEl.value;
list=list.filter(x=>{const n=parseInt(String(x.rollNo).trim(),10);if(group==='A')return Number.isFinite(n)&&n>=1&&n<=60;if(group==='B'){const type=String(x.type||'').trim().toLowerCase();return (Number.isFinite(n)&&n>=61)||type==='lateral';}return true;});
// Only read attendance for the selected date + subject, not the entire attendance history.
const attendanceQ=query(collection(db,'attendance'),where('date','==',dateEl.value),where('subject','==',sub.value));
const existing=await getDocs(attendanceQ);const map={};existing.forEach(d=>{const a=d.data();if(!a._replaced)map[a.studentId]=a.status;}); existingStatusMap=map;
// Keep the existing user-link lookup cached for this browser session to avoid repeating the same 150 reads.
let studentByRoll={};try{studentByRoll=JSON.parse(sessionStorage.getItem('attendanceStudentLinks')||'{}')}catch(_){studentByRoll={}};
const missing=list.some(x=>!studentByRoll[String(x.rollNo).trim()]);
if(missing){const usersSnap=await getDocs(collection(db,'users'));usersSnap.forEach(d=>{const u=d.data();if(u.role==='student'&&u.rollNo)studentByRoll[String(u.rollNo).trim()]={uid:d.id,email:String(u.email||'').toLowerCase()};});try{sessionStorage.setItem('attendanceStudentLinks',JSON.stringify(studentByRoll))}catch(_){} }
list.forEach(x=>{const u=studentByRoll[String(x.rollNo).trim()]||{};x.studentUid=u.uid||'';x.studentEmail=u.email||'';});body.innerHTML=list.map(x=>`<tr><td>${safeText(x.rollNo||'')}</td><td>${safeText(x.name||'')}</td><td>${safeText(x.type||'')}</td><td><select data-id="${x.id}"><option ${map[x.id]==='Absent'||!map[x.id]?'selected':''}>Absent</option><option ${map[x.id]==='Present'?'selected':''}>Present</option></select></td></tr>`).join('');saveBtn.style.display='inline-block';}catch(e){msg.textContent=firebaseErrorMessage(e)}};
groupEl.addEventListener('change',()=>document.getElementById('loadBtn').click());

saveBtn.onclick=async()=>{try{saveBtn.disabled=true;msg.textContent='Saving...';const entries=[...document.querySelectorAll('select[data-id]')].map(s=>({studentId:s.dataset.id,status:s.value}));if(!entries.length)throw new Error('Load students first.');const batch=writeBatch(db);for(const e of entries){const s=list.find(x=>x.id===e.studentId);const id=attendanceKey(dateEl.value,sub.value,s.id);batch.set(doc(db,'attendance',id),{date:dateEl.value,subject:sub.value,studentId:s.id,studentUid:s.studentUid||'',rollNo:String(s.rollNo),name:s.name,type:s.type||'Regular',studentEmail:(s.studentEmail||'').toLowerCase(),status:e.status,markedBy:auth.currentUser.uid,updatedAt:serverTimestamp()},{merge:true});}await batch.commit();
  // Maintain one compact summary document per subject. This is a write-only
  // aggregation: no per-student summary reads are needed.
  const summaryChanges={};
  for(const e of entries){
    const oldStatus=existingStatusMap[e.studentId]||null, newStatus=e.status;
    const classDelta=oldStatus?0:1;
    let presentDelta=0;
    if(!oldStatus && newStatus==='Present') presentDelta=1;
    else if(oldStatus==='Absent' && newStatus==='Present') presentDelta=1;
    else if(oldStatus==='Present' && newStatus==='Absent') presentDelta=-1;
    if(classDelta) summaryChanges[`students.${e.studentId}.classes`]=(classDelta);
    if(presentDelta) summaryChanges[`students.${e.studentId}.present`]=(presentDelta);
  }
  if(Object.keys(summaryChanges).length){
    await setDoc(doc(db,'attendanceSummary',encodeURIComponent(sub.value)),summaryChanges,{merge:true});
  }
  msg.textContent=`Attendance saved/updated successfully for ${entries.length} students.`;}catch(e){msg.textContent=firebaseErrorMessage(e)}finally{saveBtn.disabled=false}};
window.logout=async()=>{await signOut(auth);location.href='login.html'};
</script><script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
<script src="admin-nav.js"></script></body></html>
