<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Attendance Records</title><link rel="stylesheet" href="admin.css"><style>.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}input,select{padding:10px;border:1px solid #ccc;border-radius:5px}.present{color:green;font-weight:bold}.absent{color:red;font-weight:bold}.actions button{margin:2px;padding:7px 10px;border:0;border-radius:5px;cursor:pointer}.edit{background:#2563eb;color:#fff}.del{background:#dc2626;color:#fff}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px}.modal-card{background:#fff;padding:22px;border-radius:12px;max-width:520px;width:100%}.modal-card label{display:block;margin:10px 0 5px;font-weight:600}.modal-card input,.modal-card select{width:100%;box-sizing:border-box}</style>  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#144678">
</head><body><header><div><h1>Attendance Records</h1><p>Edit or delete attendance mistakes</p></div><button onclick="logout()">Logout</button></header><nav id="adminNav"><button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="adminNavLinks">☰ Menu</button><div class="nav-links" id="adminNavLinks"><a href="admin.html">Dashboard</a><a href="students.html">Students</a><a href="mark.html">Mark Attendance</a><a href="records.html">Records</a><a href="reports.html">Reports</a><a href="settings.html">Settings</a></div></nav><main><div class="box"><input id="search" placeholder="Search roll no or student"><select id="sub"><option value="">All Subjects</option></select><label style="display:inline-flex;align-items:center;gap:6px;margin-left:8px;font-weight:600">Date <input id="dateFilter" type="date"></label><button class="btn" id="downloadBtn">Download CSV</button></div><div class="box" style="overflow:auto"><table class="table"><thead><tr><th>Date</th><th>Roll No.</th><th>Name</th><th>Subject</th><th>Status</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div></main><div class="modal" id="modal"><div class="modal-card"><h2>Edit Attendance</h2><label>Date</label><input id="editDate" type="date"><label>Subject</label><select id="editSubject"></select><label>Status</label><select id="editStatus"><option>Absent</option><option>Present</option></select><p id="editInfo"></p><button class="btn" id="saveEdit">Save Changes</button> <button class="btn" id="cancelEdit">Cancel</button><p id="editMsg"></p></div></div><script type="module">
import {requireStaff,signOut,auth,db,collection,getDocs,doc,updateDoc,deleteDoc,getDoc,setDoc,serverTimestamp,firebaseErrorMessage,query,where,increment} from './firebase.js';
import {loadSubjects,safeText,attendanceKey} from './attendance-utils.js';
let all=[],subjects=[];await requireStaff();
const body=document.getElementById('body'),search=document.getElementById('search'),sub=document.getElementById('sub'),dateFilter=document.getElementById('dateFilter'),modal=document.getElementById('modal');dateFilter.value=new Date().toISOString().slice(0,10);
async function initSubjects(){subjects=await loadSubjects(db,collection,doc,getDoc);sub.innerHTML='<option value="">All Subjects</option>'+subjects.map(s=>`<option>${safeText(s)}</option>`).join('');editSubject.innerHTML=subjects.map(s=>`<option>${safeText(s)}</option>`).join('')}
async function load(){try{await initSubjects();const constraints=[];if(dateFilter.value)constraints.push(where('date','==',dateFilter.value));if(sub.value)constraints.push(where('subject','==',sub.value));const ref=constraints.length?query(collection(db,'attendance'),...constraints):collection(db,'attendance');const s=await getDocs(ref);all=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>!x._replaced);render()}catch(e){body.innerHTML=`<tr><td colspan="6">${firebaseErrorMessage(e)}</td></tr>`}}
function render(){const q=search.value.toLowerCase(),s=sub.value,d=dateFilter.value;const rows=all.slice().filter(x=>(String(x.name||'')+String(x.rollNo||'')+String(x.date||'')+String(x.subject||'')).toLowerCase().includes(q)&&(!s||x.subject===s)&&(!d||x.date===d)).sort((a,b)=>{const r=String(a.rollNo??'').localeCompare(String(b.rollNo??''),undefined,{numeric:true});if(r!==0)return r;const d=String(b.date??'').localeCompare(String(a.date??''));if(d!==0)return d;return String(a.subject??'').localeCompare(String(b.subject??''));});body.innerHTML=rows.map(x=>`<tr><td>${safeText(x.date)}</td><td>${safeText(x.rollNo)}</td><td>${safeText(x.name)}</td><td>${safeText(x.subject)}</td><td class="${x.status==='Present'?'present':'absent'}">${safeText(x.status)}</td><td class="actions"><button class="edit" data-edit="${x.id}">Edit</button><button class="del" data-del="${x.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">No records</td></tr>';}
body.addEventListener('click',async e=>{const id=e.target.dataset.edit||e.target.dataset.del;if(!id)return;const row=all.find(x=>x.id===id);if(!row)return;if(e.target.dataset.del){if(!confirm(`Delete attendance for Roll ${row.rollNo}, ${row.subject}, ${row.date}?`))return;try{await deleteDoc(doc(db,'attendance',id));
      const del={};del[`students.${row.studentId}.classes`]=increment(-1);if(row.status==='Present')del[`students.${row.studentId}.present`]=increment(-1);
      await setDoc(doc(db,'attendanceSummary',encodeURIComponent(row.subject)),del,{merge:true});
      all=all.filter(x=>x.id!==id);render();}catch(err){alert(firebaseErrorMessage(err))}return;}editDate.value=row.date||'';editSubject.value=row.subject||subjects[0]||'';editStatus.value=row.status||'Absent';editInfo.textContent=`Roll No. ${row.rollNo} • ${row.name}`;editMsg.textContent='';modal.style.display='flex';modal.dataset.id=id;});
cancelEdit.onclick=()=>modal.style.display='none';saveEdit.onclick=async()=>{const oldId=modal.dataset.id,row=all.find(x=>x.id===oldId);if(!row)return;try{saveEdit.disabled=true;const newId=attendanceKey(editDate.value,editSubject.value,row.studentId);const data={...row,date:editDate.value,subject:editSubject.value,status:editStatus.value,updatedBy:auth.currentUser.uid,updatedAt:serverTimestamp()};delete data.id;delete data._replaced;if(newId!==oldId){
  await setDoc(doc(db,'attendance',newId),data,{merge:true});await deleteDoc(doc(db,'attendance',oldId));row.id=newId;
  const oldChange={};oldChange[`students.${row.studentId}.classes`]=increment(-1);if(row.status==='Present')oldChange[`students.${row.studentId}.present`]=increment(-1);
  const newChange={};newChange[`students.${row.studentId}.classes`]=increment(1);if(editStatus.value==='Present')newChange[`students.${row.studentId}.present`]=increment(1);
  await setDoc(doc(db,'attendanceSummary',encodeURIComponent(row.subject)),oldChange,{merge:true});
  await setDoc(doc(db,'attendanceSummary',encodeURIComponent(editSubject.value)),newChange,{merge:true});
}else{
  await updateDoc(doc(db,'attendance',oldId),data);
  if(row.status!==editStatus.value){const ch={};ch[`students.${row.studentId}.present`]=increment(editStatus.value==='Present'?1:-1);await setDoc(doc(db,'attendanceSummary',encodeURIComponent(row.subject)),ch,{merge:true});}
}
Object.assign(row,data);modal.style.display='none';render();}catch(e){editMsg.textContent=firebaseErrorMessage(e)}finally{saveEdit.disabled=false}};
search.oninput=render;sub.onchange=load;dateFilter.onchange=load;downloadBtn.onclick=()=>{const rows=all.filter(x=>{const q=search.value.toLowerCase(),s=sub.value,d=dateFilter.value;return (String(x.name||'')+String(x.rollNo||'')+String(x.date||'')+String(x.subject||'')).toLowerCase().includes(q)&&(!s||x.subject===s)&&(!d||x.date===d)});const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[['Date','Roll No','Name','Subject','Status'],...rows.map(x=>[x.date,x.rollNo,x.name,x.subject,x.status])].map(r=>r.map(esc).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='attendance-records.csv';a.click();URL.revokeObjectURL(a.href)};
window.logout=async()=>{await signOut(auth);location.href='login.html'};load();
</script><script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
<script src="admin-nav.js"></script></body></html>
