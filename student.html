<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Attendance</title><link rel="stylesheet" href="admin.css"><style>.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.present{color:green;font-weight:bold}.absent{color:red;font-weight:bold}.summary{display:flex;gap:15px;flex-wrap:wrap}.summary .box{min-width:170px}.percent{font-size:28px;font-weight:bold}</style>  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#144678">
</head>
<body>
<header><div><h1>Student Attendance</h1><p id="welcome">My attendance</p></div><button onclick="logout()">Logout</button></header>
<nav><a href="student.html">My Attendance</a></nav>
<main>
<div class="summary"><div class="box"><span>Total Classes</span><div class="percent" id="total">0</div></div><div class="box"><span>Present</span><div class="percent" id="present">0</div></div><div class="box"><span>Absent</span><div class="percent" id="absent">0</div></div><div class="box"><span>Overall</span><div class="percent" id="percent">0%</div></div></div>
<div class="box"><h3>Subject-wise Attendance</h3><div style="overflow:auto"><table class="table"><thead><tr><th>Subject</th><th>Classes</th><th>Present</th><th>Absent</th><th>Percentage</th></tr></thead><tbody id="subjectBody"></tbody></table></div></div>
<div class="box"><h3>Attendance History</h3><label>From: <input type="date" id="fromDate"></label> <label>To: <input type="date" id="toDate"></label> <button class="btn" id="loadBtn">Load Attendance</button> <button class="btn" id="downloadPdf">Download PDF</button><button class="btn" id="downloadCsv">Download CSV</button><div style="overflow:auto"><table class="table"><thead><tr><th>Date</th><th>Roll No.</th><th>Subject</th><th>Status</th></tr></thead><tbody id="body"></tbody></table></div></div>
</main>
<script type="module">
import {requireStudent,signOut,auth,db,collection,getDocs,query,where,firebaseErrorMessage} from './firebase.js';
let profile,all=[];
try{profile=await requireStudent();}catch(e){console.error(e);}
const toDate=document.getElementById('toDate'),fromDate=document.getElementById('fromDate');const todayStr=new Date().toISOString().slice(0,10);toDate.value=todayStr;const d0=new Date();d0.setDate(d0.getDate()-180);fromDate.value=d0.toISOString().slice(0,10);async function load(){try{welcome.textContent=`${profile.name||profile.email} • Roll No. ${profile.rollNo||'-'}`;const constraints=[where('studentUid','==',profile.uid)];if(fromDate.value)constraints.push(where('date','>=',fromDate.value));if(toDate.value)constraints.push(where('date','<=',toDate.value));const q=query(collection(db,'attendance'),...constraints);const snap=await getDocs(q);all=snap.docs.map(d=>d.data()).filter(x=>!x._replaced).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));render();}catch(e){body.innerHTML=`<tr><td colspan="4">${firebaseErrorMessage(e)}</td></tr>`}}
function render(){const p=all.filter(x=>x.status==='Present').length,a=all.filter(x=>x.status==='Absent').length;total.textContent=all.length;present.textContent=p;absent.textContent=a;percent.textContent=(all.length?Math.round(p/all.length*100):0)+'%';const map={};for(const x of all){if(!map[x.subject])map[x.subject]={t:0,p:0,a:0};map[x.subject].t++;if(x.status==='Present')map[x.subject].p++;else map[x.subject].a++;}subjectBody.innerHTML=Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0])).map(([s,v])=>`<tr><td>${s}</td><td>${v.t}</td><td>${v.p}</td><td>${v.a}</td><td>${Math.round(v.p/v.t*100)}%</td></tr>`).join('')||'<tr><td colspan="5">No attendance records yet</td></tr>';body.innerHTML=all.map(x=>`<tr><td>${x.date||''}</td><td>${x.rollNo||''}</td><td>${x.subject||''}</td><td class="${x.status==='Present'?'present':'absent'}">${x.status||''}</td></tr>`).join('')||'<tr><td colspan="4">No attendance records yet</td></tr>'}
downloadCsv.onclick=()=>{const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[['Date','Roll No','Subject','Status'],...all.map(x=>[x.date,x.rollNo,x.subject,x.status])].map(r=>r.map(esc).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='my-attendance.csv';a.click();URL.revokeObjectURL(a.href)};
downloadPdf.onclick=async()=>{try{const {jsPDF}=window.jspdf;const pdf=new jsPDF();const img=new Image();img.src='logo.png';await new Promise((res,rej)=>{img.onload=res;img.onerror=rej});pdf.addImage(img,'PNG',14,10,55,18);pdf.setFontSize(15);pdf.text('My Attendance Report',75,18);pdf.setFontSize(10);pdf.text(`${profile.name||profile.email} • Roll No. ${profile.rollNo||'-'}`,75,25);let y=38;pdf.setFontSize(9);['Date','Roll','Subject','Status'].forEach((h,i)=>pdf.text(h,[14,48,82,130][i],y));y+=7;all.forEach(x=>{if(y>275){pdf.addPage();y=15}pdf.text(String(x.date||''),14,y);pdf.text(String(x.rollNo||''),48,y);pdf.text(String(x.subject||''),82,y);pdf.text(String(x.status||''),130,y);y+=6});pdf.save('my-attendance.pdf')}catch(e){alert('PDF download failed. Please check internet connection once and try again.')}};
document.getElementById('loadBtn').onclick=load;window.logout=async()=>{await signOut(auth);location.href='login.html'};welcome.textContent=`${profile.name||profile.email} • Roll No. ${profile.rollNo||'-'}`;
</script><script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body></html>
